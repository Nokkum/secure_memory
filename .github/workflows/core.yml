name: Secure Memory CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-memory:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            artifact: linux-x86_64
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            artifact: linux-aarch64
          - name: macOS arm64
            os: macos-15
            artifact: macos-arm64
          - name: macOS x86_64
            os: macos-15-intel
            artifact: macos-x86_64
          - name: Windows x86_64
            os: windows-2025
            artifact: windows-x86_64

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python (shared libpython for pyo3 linking)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.os == 'ubuntu-24.04'
        run: cargo fmt --all --check

      - name: Lint with Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build secure_memory
        run: cargo build --all-targets

      - name: Run tests
        run: cargo test --lib --all-targets

      - name: Install maturin
        run: python -m pip install "maturin>=1.4,<2.0"

      - name: Build release wheel
        run: maturin build --release --out dist

      - name: Smoke-test the wheel
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "from secure_memory import SecureMemory; print(SecureMemory(16).len())"

      - name: Find build outputs
        run: find . \( -name "*.so" -o -name "*.pyd" -o -name "*.dylib" -o -name "*.whl" \)

      - name: Upload Python Wheel
        uses: actions/upload-artifact@v7
        with:
          name: secure_memory-${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

name: Secure Memory CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python (shared libpython for pyo3 linking)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint with Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build rust_core
        run: cargo build --all-targets

      - name: Run tests
        run: cargo test --lib --all-targets

      - name: Install maturin
        run: python -m pip install "maturin>=1.4,<2.0"

      - name: Build release wheel
        run: maturin build --release --out dist

      - name: Find build outputs
        run: find . -name "*.so" -o -name "*.whl"
          
      - name: Upload Python Wheel
        uses: actions/upload-artifact@v7
        with:
          name: secure_memory-linux-x86_64
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30
